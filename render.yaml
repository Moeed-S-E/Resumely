services:
  - type: web
    name: resume-ats
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RENDER
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
