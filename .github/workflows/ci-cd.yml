name: Resumely CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libgraphite2-3 libharfbuzz0b libharfbuzz-icu0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Execute Permissions for Tectonic
        run: chmod +x tectonic

      - name: Run Django Tests
        env:
          SECRET_KEY: "test-secret-key-for-github-actions"
          DEBUG: "True"
          # Mock the GROQ key since API calls are mocked in tests anyway
          GROQ_API_KEY: "mocked_key" 
          # Render=False ensures it uses the local sqlite3 db for tests
          RENDER: "False"
        run: |
          python manage.py test

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Only run deploy job on pushes to main, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        # Uses the webhook URL provided by Render to trigger the deployment.
        # Ensure you configure this Secret in your GitHub Repository settings.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not set!"
            exit 1
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
