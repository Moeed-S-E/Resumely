<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Generated Resume | Resumely</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .markdown-body h1 {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 0.5em;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3em;
        }

        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #00288e;
        }

        .markdown-body h3 {
            font-size: 1.25em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }

        .markdown-body p {
            margin-bottom: 1em;
            line-height: 1.6;
        }

        .markdown-body ul {
            list-style-type: disc;
            margin-left: 1.5em;
            margin-bottom: 1em;
        }

        .markdown-body li {
            margin-bottom: 0.25em;
        }

        .markdown-body strong {
            font-weight: bold;
            color: #111;
        }
    </style>
</head>

<body class="bg-[#f7f9fb] text-[#191c1e] font-['Inter'] min-h-screen flex flex-col">
    <header class="bg-white border-b border-[#e2e8f0] shadow-sm sticky top-0 z-50">
        <nav class="flex justify-between items-center w-full px-8 h-16 max-w-7xl mx-auto">
            <div class="flex items-center gap-2">
                <a href="{% url 'resume_ats_analyzer:upload' %}" class="text-2xl font-extrabold text-[#00288e] hover:underline">Resumely</a>
            </div>
            <div class="flex gap-4">
                <a href="{% url 'resume_ats_analyzer:builder' %}" class="font-bold text-[#00288e] hover:underline">Build
                    Another</a>
            </div>
        </nav>
    </header>
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-12">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900">Your New ATS-Friendly Resume</h1>
            <p class="text-slate-600 mt-2">Tailored specifically for the provided job description.</p>
        </div>

        <div class="bg-white border border-[#e2e8f0] rounded-xl p-8 shadow-sm h-[800px]">
            <embed src="{% url 'resume_ats_analyzer:download_builder' pk=builder.id %}" type="application/pdf" width="100%" height="100%" class="rounded-lg shadow-inner border border-border-subtle" />
        </div>

        <div class="mt-8 flex justify-end gap-4">
            <a href="{% url 'resume_ats_analyzer:download_builder' pk=builder.id %}" target="_blank" download="resume.pdf"
                class="px-6 py-3 bg-[#00288e] text-white font-bold rounded-lg shadow-sm hover:opacity-90 flex items-center gap-2">
                <span class="material-symbols-outlined">picture_as_pdf</span> Download PDF
            </a>
        </div>
    </main>
</body>

</html>
