<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.add('light');
        }
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Generated Resume | Resumely</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .markdown-body h1 {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 0.5em;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3em;
        }

        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #00288e;
        }

        .markdown-body h3 {
            font-size: 1.25em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }

        .markdown-body p {
            margin-bottom: 1em;
            line-height: 1.6;
        }

        .markdown-body ul {
            list-style-type: disc;
            margin-left: 1.5em;
            margin-bottom: 1em;
        }

        .markdown-body li {
            margin-bottom: 0.25em;
        }

        .markdown-body strong {
            font-weight: bold;
            color: #111;
        }
    </style>
</head>

<body class="bg-[#f7f9fb] dark:bg-[#121212] text-[#191c1e] dark:text-gray-200 font-['Inter'] min-h-screen flex flex-col">
    <header class="bg-surface dark:bg-[#121212] border-b border-border-subtle dark:border-gray-700 shadow-sm sticky top-0 z-50">
    <nav class="flex justify-between items-center w-full px-4 md:px-8 h-16 max-w-7xl mx-auto">
        <div class="flex items-center gap-4 md:gap-8">
            <a href="{% url 'resume_ats_analyzer:upload' %}" class="text-xl md:text-2xl font-extrabold text-primary hover:underline">Resumely</a>
            <div class="flex items-center gap-3 md:gap-6">
                <a href="{% url 'resume_ats_analyzer:upload' %}" class="font-bold text-on-surface dark:text-gray-200 hover:text-primary transition-colors flex items-center gap-1" title="Analyzer">
                    <span class="material-symbols-outlined text-xl">analytics</span> <span class="hidden md:inline">Analyzer</span>
                </a>
                <a href="{% url 'resume_ats_analyzer:builder' %}" class="font-bold text-on-surface dark:text-gray-200 hover:text-primary transition-colors flex items-center gap-1" title="Builder">
                    <span class="material-symbols-outlined text-xl">auto_awesome</span> <span class="hidden md:inline">Builder</span>
                </a>
            </div>
        </div>
        <div class="flex items-center">
            <button id="themeToggle" class="p-2 text-on-surface dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                <span class="material-symbols-outlined hidden dark:block">light_mode</span>
            </button>
        </div>
    </nav>
</header>
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-12">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white">Your New ATS-Friendly Resume</h1>
            <p class="text-slate-600 dark:text-gray-400 mt-2">Tailored specifically for the provided job description.</p>
        </div>

        <div class="bg-white dark:bg-[#1e1e1e] border border-[#e2e8f0] rounded-xl p-8 shadow-sm h-[800px]">
            <embed src="{% url 'resume_ats_analyzer:download_builder' pk=builder.id %}" type="application/pdf" width="100%" height="100%" class="rounded-lg shadow-inner border border-border-subtle" />
        </div>

        <div class="mt-8 flex justify-end gap-4">
            <a href="{% url 'resume_ats_analyzer:download_builder' pk=builder.id %}" target="_blank" download="resume.pdf"
                class="px-6 py-3 bg-[#00288e] text-white font-bold rounded-lg shadow-sm hover:opacity-90 flex items-center gap-2">
                <span class="material-symbols-outlined">picture_as_pdf</span> Download PDF
            </a>
        </div>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const themeBtn = document.getElementById('themeToggle');
        if(themeBtn) {
            themeBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                    localStorage.theme = 'light';
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                    localStorage.theme = 'dark';
                }
            });
        }
    });
</script>
</body>

</html>
